# php2shell — CVE-2026-109618 / CVE-2026-109619
# ModSecurity v2 / v3 drop-in. Apache, nginx (with modsecurity), and any
# CRS-compatible engine.
#
#   Include /path/to/modsecurity.conf
#
# Rules are grouped:
#   900100-900109  block the primary vector (request side)
#   900110-900119  detect session injection payload shapes
#   900120-900129  detect stale-state indicators (response side)
#
# Start in SecRuleEngine DetectionOnly, confirm no legitimate upload-progress
# traffic, then switch to On.

SecRuleEngine On

SecRule REQUEST_HEADERS:Content-Type "@rx ^multipart/form-data" \
    "id:900100,phase:1,pass,nolog,chain,msg:'php2shell: multipart upload'"
    SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
        "t:none,id:900100,phase:2,deny,status:403,log,msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS in request body (CVE-2026-109618/109619)',tag:'CVE-2026-109618',tag:'CVE-2026-109619',severity:'CRITICAL'"

SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
    "id:900101,phase:2,deny,status:403,log,msg:'php2shell: upload progress handler invoked',tag:'CVE-2026-109618',severity:'CRITICAL'"

SecRule FILES_NAMES "@rx <\?|<\?php|<\?=" \
    "id:900110,phase:2,deny,status:403,log,msg:'php2shell: PHP code in uploaded filename (chain A)',tag:'CVE-2026-109618',severity:'CRITICAL'"

SecRule FILES_NAMES "@rx \|\s*[aOsiC]:" \
    "id:900111,phase:2,deny,status:403,log,msg:'php2shell: serialized object with pipe in filename (chain C)',tag:'CVE-2026-109619',severity:'CRITICAL'"

SecRule FILES_NAMES "@rx O:\d+:" \
    "id:900112,phase:2,deny,status:403,log,msg:'php2shell: serialized object in filename (chain C variant)',tag:'CVE-2026-109619',severity:'CRITICAL'"

SecRule ARGS_NAMES "@contains PHPSESSID" \
    "id:900113,phase:2,deny,status:403,log,msg:'php2shell: PHPSESSID supplied as POST field (session fixation primitive)',tag:'CVE-2026-109618',severity:'CRITICAL'"

SecRule REQUEST_HEADERS:Transfer-Encoding "@contains chunked" \
    "id:900114,phase:1,pass,nolog,chain,msg:'php2shell: chunked body'"
    SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" \
        "t:none,id:900114,phase:2,deny,status:403,log,msg:'php2shell: chunked multipart without Content-Length (OOM bypass, chain D)',tag:'CVE-2026-109618',severity:'CRITICAL'"

# Response-side confirmation of the stale-state paths. Keep as 'pass' with a
# high anomaly score so it feeds your SIEM without tearing down the session.
SecRule RESPONSE_BODY "@contains Failed to decode session object" \
    "id:900120,phase:4,pass,log,msg:'php2shell: session decode failure (chain C/E indicator)',tag:'CVE-2026-109619',severity:'HIGH'"

SecRule RESPONSE_BODY "@contains Session object destruction failed" \
    "id:900121,phase:4,pass,log,msg:'php2shell: session destruction failure (chain C/E indicator)',tag:'CVE-2026-109619',severity:'HIGH'"

SecRule RESPONSE_BODY "@rx Allowed memory size .{0,80}exhausted.{0,80}Unknown on line 0" \
    "id:900122,phase:4,pass,log,msg:'php2shell: SAPI-phase OOM (chain D indicator)',tag:'CVE-2026-109618',severity:'HIGH'"

SecRule RESPONSE_HEADERS:X-Powered-By "@rx PHP/8\.(2\.([0-9]|[12][0-9]|3[0-4])|3\.([0-9]|[12][0-9]|3[0-5])|4\.([0-9]|1[0-9]|2[0-6])|5\.([0-9]|1[01]))" \
    "id:900130,phase:3,pass,log,msg:'php2shell: vulnerable PHP version disclosed',tag:'CVE-2026-109618',tag:'CVE-2026-109619',severity:'HIGH'"

# Server-side version assertion (defence in depth, not a substitute for patching).
SecRule TX:PHP_VERSION "@rx ^8\.(2\.[0-3][0-9]|3\.[0-3][0-9]|4\.[0-2][0-9]|5\.([0-9]|1[01]))$" \
    "id:900131,phase:1,pass,log,msg:'php2shell: runtime version inside the affected range',tag:'CVE-2026-109618',severity:'CRITICAL'"
