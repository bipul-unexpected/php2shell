; Intentionally vulnerable lab configuration.
; Mirrors a default PHP install: upload_progress enabled, permissive sessions.
; The OOM strategy in the lab uses a small memory_limit so a modest request
; reaches the corruption path without needing hundreds of MB on the wire.

session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.use_only_cookies = Off
session.use_strict_mode = Off
session.save_path = "/tmp/sess"
session.serialize_handler = php

memory_limit = 32M
post_max_size = 8M
max_file_uploads = 20

expose_php = On
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; keep the lab quiet about the OOM noise but visible enough to confirm
log_errors = On
error_log = /proc/self/fd/2
