services:
  fpm:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: php2shell-fpm
    volumes:
      - ./www:/var/www/html:ro
      - sessions:/tmp/sess
    environment:
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d
    networks: [lab]
    # exposed through nginx

  nginx:
    image: nginx:1.27-alpine
    container_name: php2shell-nginx
    depends_on: [fpm]
    ports:
      - "18080:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lab]

  apache:
    build:
      context: .
      dockerfile: php-apache/Dockerfile
    container_name: php2shell-apache
    ports:
      - "18081:80"
    volumes:
      - ./www:/var/www/html:ro
      - sessions:/tmp/sess
    networks: [lab]

volumes:
  sessions:

networks:
  lab:
    driver: bridge
